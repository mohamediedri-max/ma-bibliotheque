<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b35">
<title>مكتبتي | Ma Bibliothèque — 0.9</title>
<style>
:root{
  --green:#173b35;--green2:#24574d;--gold:#c5a46d;--paper:#f6f4ee;--white:#fff;
  --surface:#fff;--surface2:#fbfbf8;--ink:#24312e;--muted:#77817d;--line:#e5e6df;
  --red:#a74343;--tag-bg:#edf3ef;--tag-ink:#173b35;--shadow:0 10px 30px #173b3510
}
html[data-theme="dark"]{
  --green:#2a6f63;--green2:#358577;--gold:#d4b378;--paper:#121716;--white:#1a211f;
  --surface:#1a211f;--surface2:#212a27;--ink:#e7ecea;--muted:#9aa6a2;--line:#2d3834;
  --red:#e07070;--tag-bg:#233b35;--tag-ink:#b7dfd5;--shadow:0 10px 30px #00000045
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.side{background:#173b35;color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.logo{width:42px;height:42px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;color:#e5c991;font-size:23px}
.brand h1{font-size:20px;margin:0}
.brand small{display:block;color:#b9cbc4;font-size:11px;margin-top:4px;direction:ltr;text-align:right}
html[dir="ltr"] .brand small{text-align:left}
.nav-label{font-size:11px;color:#a9c0b8;padding:0 12px;margin:5px 0}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:#d9e5df;text-align:right;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}
.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}
.nav .ico{width:22px;text-align:center;font-size:17px}
.side-foot{margin-top:auto;color:#b9cbc4;font-size:11px;line-height:1.8;padding:8px}
.main{min-width:0}
.top{min-height:76px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 34px;gap:15px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{font-size:18px;margin:0}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lang,.outline,.primary,.danger,.icon-btn{border-radius:9px;padding:9px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn{padding:9px 11px;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--green);color:#fff;border-color:var(--green)}
.primary:hover{background:var(--green2)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;font-size:11px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#888}
.sync-pill.online .sync-dot{background:#249e58}
.sync-pill.syncing .sync-dot{background:#d89b1e}
.sync-pill.error .sync-dot{background:var(--red)}
.content{padding:30px 34px;max-width:1500px;margin:auto}
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.welcome h2{font-size:25px;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0;font-size:13px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:bold;letter-spacing:.4px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat,.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.stat{padding:18px}
.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--green);font-size:17px}
.stat strong{display:block;font-size:26px;margin-top:13px;color:var(--green)}
.panel{padding:20px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.panel-head h3{font-size:16px;margin:0}
.muted{color:var(--muted);font-size:12px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:right;color:var(--ink)}
.quick:hover{border-color:var(--gold);background:var(--surface2)}
.quick b{display:block;margin:8px 0 4px}
.quick span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.toolbar input,.toolbar select{max-width:260px}
.field,input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--surface);color:var(--ink);width:100%;outline:none}
.field:focus,input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c5a46d25}
.toolbar .search{flex:1;min-width:200px;max-width:none}
.book-filters{display:grid;grid-template-columns:repeat(3,minmax(160px,1fr));gap:12px;margin:0 0 15px}
.filter-box{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px}
.filter-box label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}
.book-counts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.count-chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 10px;font-size:11px;color:var(--muted)}
.count-chip b{color:var(--green);margin-inline-start:4px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:normal;font-size:11px;background:var(--surface2)}
td strong{font-weight:600}
.title-link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:inherit}
.title-link:hover{color:var(--gold);text-decoration:underline}
.tag{display:inline-block;background:var(--tag-bg);color:var(--tag-ink);border-radius:20px;padding:4px 8px;font-size:11px}
.status-badge{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;margin-inline-start:4px}
.st-unread{background:#ececec;color:#555}
.st-reading{background:#fff3cd;color:#856404}
.st-read{background:#d4edda;color:#155724}
.st-review{background:#e2e3f3;color:#383d7c}
html[data-theme="dark"] .st-unread{background:#2d3432;color:#b8c2be}
html[data-theme="dark"] .st-reading{background:#3d3319;color:#f3d27a}
html[data-theme="dark"] .st-read{background:#1b3b28;color:#8ee0ac}
html[data-theme="dark"] .st-review{background:#282a45;color:#b8bdf8}
.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:11px}
.mini:hover{border-color:var(--gold)}
.mini.del{color:var(--red)}
.section-title{margin:0 0 18px;font-size:23px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;color:var(--muted)}
.form-group.full{grid-column:1/-1}
.form-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
.modal{position:fixed;inset:0;background:#10201dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.modal-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.modal-head h3{margin:0}
.close{border:0;background:transparent;font-size:24px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:20px;background:#173b35;color:#fff;padding:12px 17px;border-radius:10px;display:none;z-index:30;font-size:13px;box-shadow:var(--shadow)}
.toast.show{display:block}
.hidden{display:none!important}
.home-search{border:2px solid var(--gold)}
.global-results{margin-top:12px;max-height:360px;overflow:auto}
.global-results h4{font-size:12px;color:var(--muted);margin:12px 0 6px}
.result-row{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:right;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:5px 0;color:var(--ink)}
.result-row:hover{border-color:var(--gold)}
.result-row span{font-size:11px;color:var(--muted)}
.footer-note{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.8}
.author-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--surface2)}
.author-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.publisher-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.publisher-tools button{white-space:nowrap}
.publisher-status{font-size:11px;color:var(--muted);line-height:1.6}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px}
.detail-item b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.detail-item span{font-size:13px;word-break:break-word;line-height:1.6}
.detail-item.full{grid-column:1/-1}
.detail-item a{color:var(--gold)}
.auth-tabs{display:flex;gap:8px;margin-bottom:14px}
.auth-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.user-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.err-box{margin-top:10px;padding:10px 12px;border-radius:9px;background:#fdeaea;color:#8e2424;font-size:12px;line-height:1.6}
.info-box{margin-top:10px;padding:10px 12px;border-radius:9px;background:#edf5f0;color:#173b35;font-size:12px;line-height:1.6}
html[data-theme="dark"] .err-box{background:#3a1c1c;color:#f4a2a2}
html[data-theme="dark"] .info-box{background:#1b332c;color:#bce3d7}
html[dir="ltr"] th,html[dir="ltr"] td,html[dir="ltr"] .nav button,html[dir="ltr"] .quick,html[dir="ltr"] .result-row{text-align:left}
@media(max-width:980px){.quick-grid{grid-template-columns:repeat(2,1fr)}.book-filters{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{padding:12px;gap:10px}
  .brand{padding:5px}
  .nav{display:flex;overflow:auto}
  .nav-label,.side-foot{display:none}
  .nav button{white-space:nowrap;padding:9px 12px}
  .top{min-height:62px;padding:10px 16px}
  .content{padding:20px 15px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .welcome{align-items:flex-start;flex-direction:column}
  .stats{gap:9px}
  .stat{padding:13px}
  .stat strong{font-size:22px}
  .quick-grid,.book-filters,.form-grid,.detail-grid{grid-template-columns:1fr}
  .form-group.full,.detail-item.full{grid-column:auto}
  .top h2{font-size:15px}
  table,thead,tbody,th,td,tr{display:block;min-width:0}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
  td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  td::before{content:attr(data-label);font-size:11px;color:var(--muted);flex-shrink:0}
  td:first-child{display:block;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
  td:first-child::before{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">▤</div><div><h1 id="brandTitle">مكتبتي</h1><small>MA BIBLIOTHÈQUE</small></div></div>
  <div><div class="nav-label" data-ar="القائمة الرئيسية" data-fr="NAVIGATION">القائمة الرئيسية</div>
  <nav class="nav" id="nav">
    <button class="active" type="button" data-page="home"><span class="ico">⌂</span><span data-ar="الرئيسية" data-fr="Accueil">الرئيسية</span></button>
    <button type="button" data-page="books"><span class="ico">▤</span><span data-ar="فضاء الكتب" data-fr="Espace des livres">فضاء الكتب</span></button>
    <button type="button" data-page="collections"><span class="ico">▥</span><span data-ar="السلاسل وكتب الجيب" data-fr="Collections et livres de poche">السلاسل وكتب الجيب</span></button>
    <button type="button" data-page="periodicals"><span class="ico">▧</span><span data-ar="المجلات والدوريات" data-fr="Revues et périodiques">المجلات والدوريات</span></button>
    <button type="button" data-page="articles"><span class="ico">≡</span><span data-ar="المقالات والدراسات" data-fr="Articles et études">المقالات والدراسات</span></button>
    <button type="button" data-page="authors"><span class="ico">♙</span><span data-ar="المؤلفون والناشرون" data-fr="Auteurs et éditeurs">المؤلفون والناشرون</span></button>
    <button type="button" data-page="classification"><span class="ico">▦</span><span data-ar="التصنيف الموضوعي" data-fr="Classification">التصنيف الموضوعي</span></button>
    <button type="button" data-page="backup"><span class="ico">⇅</span><span data-ar="النسخ والمزامنة" data-fr="Sauvegarde et sync">النسخ والمزامنة</span></button>
  </nav></div>
  <div class="side-foot" data-ar="الإصدار 0.9 · مزامنة سحابية Firebase." data-fr="Version 0.9 · synchronisation cloud Firebase.">الإصدار 0.9 · مزامنة سحابية Firebase.</div>
</aside>
<main class="main">
<header class="top">
  <h2 id="pageHeading">الرئيسية</h2>
  <div class="top-actions">
    <span class="sync-pill" id="syncBadge" title="حالة المزامنة">
      <span class="sync-dot"></span>
      <span id="syncText">محلي فقط</span>
    </span>
    <button class="outline" id="authBtn" type="button" onclick="window.openAuthModal()">☁ <span id="authBtnLabel">تسجيل الدخول</span></button>
    <button class="icon-btn" id="themeBtn" type="button" title="تبديل المظهر">☾</button>
    <button class="outline" id="langBtn" type="button">Français</button>
    <button class="primary" id="quickAdd" type="button">＋ <span data-ar="إضافة كتاب" data-fr="Ajouter un livre">إضافة كتاب</span></button>
  </div>
</header>
<div class="content" id="view"></div>
</main>
</div>

<div class="modal" id="authModal"><div class="modal-box">
  <div class="modal-head"><h3 id="authModalTitle">المزامنة السحابية (Firebase)</h3><button class="close" type="button" onclick="window.closeAuthModal()">×</button></div>
  <div id="authModalBody"></div>
</div></div>

<div class="modal" id="bookModal"><div class="modal-box">
  <div class="modal-head"><h3 id="modalTitle">إضافة كتاب جديد</h3><button class="close" id="closeModal" type="button">×</button></div>
  <form id="bookForm">
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="form-group full"><label data-ar="عنوان الكتاب *" data-fr="Titre du livre *">عنوان الكتاب *</label><input id="title" required></div>
      <div class="form-group full"><label data-ar="المؤلفون" data-fr="Auteurs">المؤلفون</label><div class="author-tools"><input id="authorSearch" list="authorSuggestions" autocomplete="off" placeholder="اكتب اسم المؤلف أو اختر مؤلفا مسجلا..." data-ar-placeholder="اكتب اسم المؤلف أو اختر مؤلفا مسجلا..." data-fr-placeholder="Saisissez ou choisissez un auteur enregistré..."><datalist id="authorSuggestions"></datalist><button class="mini" type="button" onclick="window.addAuthorToBook()">＋ <span data-ar="إضافة إلى الكتاب" data-fr="Ajouter au livre">إضافة إلى الكتاب</span></button></div><div id="authorChoices" class="author-choices" aria-live="polite"></div><div class="author-tools"><small class="muted" data-ar="اختر المؤلف المسجل لإضافته إلى الكتاب. يمكنك ربط عدة مؤلفين." data-fr="Choisissez un auteur enregistré. Plusieurs auteurs peuvent être associés.">اختر المؤلف المسجل لإضافته إلى الكتاب. يمكنك ربط عدة مؤلفين.</small><button class="mini" type="button" onclick="window.quickAddAuthor()">＋ <span data-ar="تسجيل مؤلف جديد" data-fr="Enregistrer un nouvel auteur">تسجيل مؤلف جديد</span></button></div></div>
      <div class="form-group"><label data-ar="اللغة" data-fr="Langue">اللغة</label><select id="language"><option>العربية</option><option>الفرنسية</option><option>الإنجليزية</option><option>الإسبانية</option><option>أخرى</option></select></div>
      <div class="form-group"><label data-ar="نوع المطبوع" data-fr="Type de publication">نوع المطبوع</label><select id="kind"><option value="كتاب مستقل">كتاب مستقل</option><option value="جزء من سلسلة">جزء من سلسلة</option><option value="كتاب جيب">كتاب جيب</option><option value="كتيب">كتيب</option><option value="مجموعة متعددة الأجزاء">مجموعة متعددة الأجزاء</option></select></div>
      <div class="form-group"><label data-ar="حالة القراءة" data-fr="État de lecture">حالة القراءة</label><select id="readingStatus"><option value="unread">غير مقروء / Non lu</option><option value="reading">قيد القراءة / En cours</option><option value="read">مقروء / Lu</option><option value="review">للمراجعة لاحقا / À revoir</option></select></div>
      <div class="form-group"><label data-ar="المجال الرئيسي" data-fr="Domaine principal">المجال الرئيسي</label><select id="domain"></select></div>
      <div class="form-group"><label data-ar="التخصص الفرعي" data-fr="Sous-domaine">التخصص الفرعي</label><input id="subdomain" placeholder="مثال: التاريخ الحديث"></div>
      <div class="form-group"><label data-ar="الموضوع الدقيق" data-fr="Sujet précis">الموضوع الدقيق</label><input id="topic"></div>
      <div class="form-group"><label data-ar="دار النشر" data-fr="Éditeur">دار النشر</label><input id="publisher" list="publisherSuggestions" autocomplete="off" placeholder="اكتب اسم الدار أو اختر من الاقتراحات..." data-ar-placeholder="اكتب اسم الدار أو اختر من الاقتراحات..." data-fr-placeholder="Saisissez ou choisissez un éditeur..."><datalist id="publisherSuggestions"></datalist><div class="publisher-tools"><button class="mini" type="button" id="savePublisherBtn" onclick="window.savePublisherFromInput()">＋ <span data-ar="حفظ دار النشر لإعادة استخدامها" data-fr="Enregistrer cet éditeur">حفظ دار النشر لإعادة استخدامها</span></button><small id="publisherStatus" class="publisher-status"></small></div></div>
      <div class="form-group"><label data-ar="مكان النشر" data-fr="Lieu de publication">مكان النشر</label><input id="place"></div>
      <div class="form-group"><label data-ar="سنة النشر" data-fr="Année">سنة النشر</label><input id="year" inputmode="numeric"></div>
      <div class="form-group"><label data-ar="رقم الطبعة" data-fr="Édition">رقم الطبعة</label><input id="edition"></div>
      <div class="form-group"><label data-ar="عدد الصفحات" data-fr="Nombre de pages">عدد الصفحات</label><input id="pages" inputmode="numeric"></div>
      <div class="form-group"><label>ISBN</label><input id="isbn"></div>
      <div class="form-group"><label data-ar="رقم الجرد / الرف" data-fr="Cote / inventaire">رقم الجرد / الرف</label><input id="shelf"></div>
      <div class="form-group"><label data-ar="السلسلة (إن وجدت)" data-fr="Collection (facultatif)">السلسلة (إن وجدت)</label><select id="series"><option value="">— بدون سلسلة —</option></select></div>
      <div class="form-group"><label data-ar="رقم الكتاب في السلسلة" data-fr="Numéro dans la collection">رقم الكتاب في السلسلة</label><input id="seriesNo"></div>
      <div class="form-group full"><label data-ar="كلمات مفتاحية" data-fr="Mots-clés">كلمات مفتاحية</label><input id="keywords" placeholder="افصل بين الكلمات بفاصلة"></div>

  <div id="detailModalBody"></div>
  <div class="form-actions" id="detailModalActions"></div>

<div class="toast" id="toast"></div>

<script>
const domains=[
["المعارف العامة والموسوعات","Generalités et encyclopédies"],
["الفلسفة وعلم النفس","Philosophie et psychologie"],
["الديانات والدراسات الدينية","Religions et études religieuses"],
["العلوم الاجتماعية","Sciences sociales"],
["السياسة والعلاقات الدولية","Politique et relations internationales"],
["الاقتصاد والفكر الاقتصادي","Économie et pensée économique"],
["التاريخ والحضارات","Histoire et civilisations"],
["الجغرافيا والبيئة","Géographie et environnement"],
["علوم التربية","Sciences de l'éducation"],
["ديداكتيك التاريخ والجغرافيا","Didactique de l’histoire et de la géographie"],
["لغات وأعلام","Langues et personnalités"],
["الروايات","Romans"],
["الفنون والثقافة","Arts et culture"],
["الإعلام والتواصل","Médias et communication"],
["العقيدة والفكر الإسلامي","Doctrine et pensée islamique"]
];

const loadArray=k=>{try{const v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[]}catch{return []}};
const state={
  lang:localStorage.getItem("mb_lang")||"ar",
  theme:localStorage.getItem("mb_theme")||"light",
  page:"home",
  books:loadArray("mb_books"),
  series:loadArray("mb_series"),
  periodicals:loadArray("mb_periodicals"),
  articles:loadArray("mb_articles"),
  authors:loadArray("mb_authors"),
  publishers:loadArray("mb_publishers"),
  updatedAt:localStorage.getItem("mb_updated_at")||"",
  user:null,
  syncStatus:"local",
  lastSyncMessage:"",
  authError:"",
  authInfo:"",
  authTab:"login",
  firebaseLoaded:false
};

const $=id=>document.getElementById(id), ar=()=>state.lang==="ar";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function t(a,f){return ar()?a:f}

let toastTimer=null;
function toast(msg){
  const el=$("toast");
  if(!el)return;
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

const cloudBridge={
  ready:false,
  user:null,
  async signInEmail(email,pass){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.signInEmail==="function") return window.__mbCloudImpl.signInEmail(email,pass);
    throw new Error(t("تعذر تهيئة خدمة المصادقة السحابية.","Impossible d'initialiser l'authentification cloud."));
  },
  async signUpEmail(email,pass){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.signUpEmail==="function") return window.__mbCloudImpl.signUpEmail(email,pass);
    throw new Error(t("تعذر تهيئة خدمة المصادقة السحابية.","Impossible d'initialiser l'authentification cloud."));
  },
  async signInGoogle(){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.signInGoogle==="function") return window.__mbCloudImpl.signInGoogle();
    throw new Error(t("تعذر تهيئة خدمة المصادقة السحابية.","Impossible d'initialiser l'authentification cloud."));
  },
  async signOut(){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.signOut==="function") return window.__mbCloudImpl.signOut();
  },
  async pushNow(showFeedback=false){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.pushNow==="function") return window.__mbCloudImpl.pushNow(showFeedback);
  },
  async pullNow(showFeedback=false){
    if(window.__mbCloudImpl && typeof window.__mbCloudImpl.pullNow==="function") return window.__mbCloudImpl.pullNow(showFeedback);
  }
};
window.__mbCloud=cloudBridge;

function setSyncStatus(status,msg=""){
  state.syncStatus=status;
  if(msg)state.lastSyncMessage=msg;
  const badge=$("syncBadge"),txt=$("syncText");
  if(!badge||!txt)return;
  badge.classList.remove("online","syncing","error");
  if(status==="online"){
    badge.classList.add("online");
    txt.textContent=t("مزامَن","Synchronisé");
  }else if(status==="syncing"){
    badge.classList.add("syncing");
    txt.textContent=t("جارٍ المزامنة...","Synchronisation...");
  }else if(status==="error"){
    badge.classList.add("error");
    txt.textContent=t("خطأ مزامنة","Erreur sync");
  }else{
    txt.textContent=t("محلي فقط","Local uniquement");
  }
  updateAuthHeaderUI();
}

function updateAuthHeaderUI(){
  const lbl=$("authBtnLabel");
  if(!lbl)return;
  if(state.user){
    lbl.textContent=state.user.email||t("حسابي","Mon compte");
  }else{
    lbl.textContent=t("تسجيل الدخول","Connexion");
  }
}

function buildPayload(){
  return {
    app:"مكتبتي – Ma Bibliothèque",
    version:"0.9",
    schemaVersion:8,
    updatedAt:state.updatedAt||new Date().toISOString(),
    books:state.books,
    series:state.series,
    periodicals:state.periodicals,
    articles:state.articles,
    authors:state.authors,
    publishers:state.publishers
  };
}

function applyRemotePayload(data){
  if(!data||typeof data!=="object")return;
  for(const k of ["books","series","periodicals","articles","authors","publishers"]){
    if(Array.isArray(data[k]))state[k]=data[k];
  }
  if(data.updatedAt)state.updatedAt=data.updatedAt;
  migrateSeriesData();
  migrateAuthors();
  migratePublisherRecords();
  writeLocalStorageOnly();
  render();
}
window.__mbApplyRemote=applyRemotePayload;

function writeLocalStorageOnly(){
  localStorage.setItem("mb_books",JSON.stringify(state.books));
  localStorage.setItem("mb_series",JSON.stringify(state.series));
  localStorage.setItem("mb_periodicals",JSON.stringify(state.periodicals));
  localStorage.setItem("mb_articles",JSON.stringify(state.articles));
  localStorage.setItem("mb_authors",JSON.stringify(state.authors));
  localStorage.setItem("mb_publishers",JSON.stringify(state.publishers));
  if(state.updatedAt)localStorage.setItem("mb_updated_at",state.updatedAt);
  localStorage.setItem("mb_schema_version","8");
}

function save(){
  state.updatedAt=new Date().toISOString();
  writeLocalStorageOnly();
  if(state.user && typeof window.__mbSchedulePush==="function"){
    window.__mbSchedulePush();
  }
}

function openAuthModal(){
  state.authError="";
  state.authInfo="";
  renderAuthModal();
  const m=$("authModal");
  if(m)m.classList.add("show");
}
function closeAuthModal(){
  const m=$("authModal");
  if(m)m.classList.remove("show");
}
window.openAuthModal=openAuthModal;
window.closeAuthModal=closeAuthModal;

window.switchAuthTab=function(tab){
  state.authTab=tab;
  state.authError="";
  state.authInfo="";
  renderAuthModal();
};

window.handleEmailAuth=async function(e){
  e.preventDefault();
  state.authError="";
  state.authInfo="";
  const email=($("authEmail")?$("authEmail").value:"").trim();
  const pass=$("authPassword")?$("authPassword").value:"";
  if(!email||!pass){
    state.authError=t("يرجى إدخال البريد الإلكتروني وكلمة المرور.","Veuillez saisir l'e-mail et le mot de passe.");
    renderAuthModal();
    return;
  }
  try{
    if(state.authTab==="login"){
      await cloudBridge.signInEmail(email,pass);
      state.authInfo=t("تم تسجيل الدخول بنجاح.","Connexion réussie.");
      closeAuthModal();
    }else{
      await cloudBridge.signUpEmail(email,pass);
      state.authInfo=t("تم إنشاء الحساب بنجاح.","Compte créé avec succès.");
      closeAuthModal();
    }
  }catch(err){
    state.authError=(err && err.message) ? err.message : t("تعذر إتمام عملية الدخول.","Échec de la connexion.");
    renderAuthModal();
  }
};

window.handleGoogleAuth=async function(){
  state.authError="";
  state.authInfo="";
  try{
    await cloudBridge.signInGoogle();
    closeAuthModal();
  }catch(err){
    state.authError=(err && err.message) ? err.message : t("تعذر تسجيل الدخول عبر Google.","Échec de la connexion Google.");
    renderAuthModal();
  }
};

window.handleLogout=async function(){
  state.authError="";
  try{
    await cloudBridge.signOut();
    closeAuthModal();
  }catch(err){
    state.authError=(err && err.message) ? err.message : t("تعذر تسجيل الخروج.","Échec de la déconnexion.");
    renderAuthModal();
  }
};

window.manualCloudSync=async function(){
  state.authError="";
  state.authInfo="";
  try{
    await cloudBridge.pushNow(true);
    state.authInfo=t("تمت المزامنة السحابية بنجاح.","Synchronisation cloud réussie.");
    renderAuthModal();
  }catch(err){
    state.authError=(err && err.message) ? err.message : t("تعذرت المزامنة.","Échec de la synchronisation.");
    renderAuthModal();
  }
};

function renderAuthModal(){
  const box=$("authModalBody");
  if(!box)return;
  if(state.user){
    box.innerHTML=`
      <div class="user-box">
        <div>
          <b>${esc(state.user.email||t("حساب مفعل","Compte actif"))}</b>
          <div class="muted">${t("المزامنة التلقائية مفعّلة مع قاعدة بيانات Firestore.","Synchronisation automatique activée avec Firestore.")}</div>
        </div>
        <div class="actions">
          <button class="primary" type="button" onclick="window.manualCloudSync()">↻ ${t("مزامنة الآن","Synchroniser")}</button>
          <button class="outline" type="button" onclick="window.handleLogout()">${t("تسجيل الخروج","Déconnexion")}</button>
        </div>
      </div>
      ${state.authInfo?`<div class="info-box">${esc(state.authInfo)}</div>`:""}
      ${state.authError?`<div class="err-box">${esc(state.authError)}</div>`:""}
      <p class="hint" style="margin-top:12px">${t("أي إضافة أو تعديل أو حذف في الكتب أو السلاسل أو المجلات أو المقالات أو المؤلفين أو الناشرين يُحفظ محلياً ويُرفع تلقائياً إلى حسابك لتراه على حاسوبيك وهاتفيك.","Toute modification est enregistrée localement et synchronisée automatiquement sur vos appareils.")}</p>
    `;
    return;
  }
  const isLogin=state.authTab==="login";
  const protocolNote = window.location.protocol === "file:"
    ? `<div class="info-box">${t("ملاحظة: إذا كنت تفتح الملف مباشرة من جهازك (file://) وواجهت مشكلة في نافذة Google المنبثقة، فاستخدم البريد وكلمة المرور أو شغّله عبر خادم محلي أو استضافة Firebase / GitHub Pages.","Note : en ouverture locale (file://), privilégiez l'e-mail/mot de passe ou un serveur local si la fenêtre Google est bloquée.")}</div>`
    : "";
  box.innerHTML=`
    <div class="auth-tabs">
      <button type="button" class="outline ${isLogin?"active":""}" onclick="window.switchAuthTab('login')">${t("تسجيل الدخول","Connexion")}</button>
      <button type="button" class="outline ${!isLogin?"active":""}" onclick="window.switchAuthTab('register')">${t("إنشاء حساب جديد","Créer un compte")}</button>
    </div>
    <form onsubmit="window.handleEmailAuth(event)" class="form-grid">
      <div class="form-group full"><label for="authEmail">${t("البريد الإلكتروني","Adresse e-mail")}</label><input id="authEmail" type="email" required autocomplete="email"></div>
      <div class="form-group full"><label for="authPassword">${t("كلمة المرور","Mot de passe")}</label><input id="authPassword" type="password" required minlength="6" autocomplete="${isLogin?"current-password":"new-password"}"></div>
      <div class="form-group full form-actions" style="margin-top:4px">
        <button class="primary" type="submit">${isLogin?t("دخول ومزامنة","Connexion et sync"):t("إنشاء الحساب","Créer le compte")}</button>
        <button class="outline" type="button" onclick="window.handleGoogleAuth()">${t("الدخول عبر Google","Connexion Google")}</button>
      </div>
    </form>
    ${protocolNote}
    ${state.authInfo?`<div class="info-box">${esc(state.authInfo)}</div>`:""}
    ${state.authError?`<div class="err-box">${esc(state.authError)}</div>`:""}
  `;
}

function migrateSeriesData(){
  if(!Array.isArray(state.series))state.series=[];
  state.series=state.series.map(s=>typeof s==="string"?{id:"s_"+Math.random().toString(36).slice(2,8),title:s,kind:"سلسلة",publisher:"",notes:""}:s);
}
function migrateAuthors(){
  if(!Array.isArray(state.authors))state.authors=[];
  const map=new Map();
  for(const a of state.authors){
    const name=(typeof a==="string"?a:(a&&a.name)||"").trim();
    if(name && !map.has(name))map.set(name,{id:(a&&a.id)||"au_"+Math.random().toString(36).slice(2,8),name,bio:(a&&a.bio)||"",country:(a&&a.country)||""});
  }
  for(const b of state.books){
    const raw=Array.isArray(b.authors)?b.authors:(b.author?[b.author]:[]);
    for(const n of raw){
      const name=String(n||"").trim();
      if(name && !map.has(name))map.set(name,{id:"au_"+Math.random().toString(36).slice(2,8),name,bio:"",country:""});
    }
  }
  state.authors=Array.from(map.values());
}
function migratePublisherRecords(){
  if(!Array.isArray(state.publishers))state.publishers=[];
  const map=new Map();
  for(const p of state.publishers){
    const name=(typeof p==="string"?p:(p&&p.name)||"").trim();
    if(name && !map.has(name))map.set(name,{id:(p&&p.id)||"pub_"+Math.random().toString(36).slice(2,8),name,place:(p&&p.place)||"",notes:(p&&p.notes)||""});
  }
  for(const b of state.books){
    const name=String(b.publisher||"").trim();
    if(name && !map.has(name))map.set(name,{id:"pub_"+Math.random().toString(36).slice(2,8),name,place:b.place||"",notes:""});
  }
  state.publishers=Array.from(map.values());
}

migrateSeriesData();
migrateAuthors();
migratePublisherRecords();

const statusLabel=st=>({
  unread:t("غير مقروء","Non lu"),
  reading:t("قيد القراءة","En cours"),
  read:t("مقروء","Lu"),
  review:t("للمراجعة","À revoir")
}[st]||t("غير مقروء","Non lu"));

const statusClass=st=>({
  unread:"st-unread",
  reading:"st-reading",
  read:"st-read",
  review:"st-review"
}[st]||"st-unread");

function applyTheme(){
  document.documentElement.setAttribute("data-theme",state.theme);
  const btn=$("themeBtn");
  if(btn)btn.textContent=state.theme==="dark"?"☀":"☾";
}

function applyLang(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=ar()?"rtl":"ltr";
  $("brandTitle").textContent=t("مكتبتي","Ma Bibliothèque");
  $("langBtn").textContent=ar()?"Français":"العربية";
  document.querySelectorAll("[data-ar]").forEach(el=>{el.textContent=el.getAttribute(ar()?"data-ar":"data-fr")});
  document.querySelectorAll("[data-ar-placeholder]").forEach(el=>{el.placeholder=el.getAttribute(ar()?"data-ar-placeholder":"data-fr-placeholder")});
  const dom=$("domain");
  if(dom){
    const cur=dom.value;
    dom.innerHTML=domains.map(d=>`<option value="${esc(d[0])}">${esc(ar()?d[0]:d[1])}</option>`).join("");
    if(cur)dom.value=cur;
  }
  setSyncStatus(state.syncStatus);
  render();
}

function setPage(p){
  state.page=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  const titles={
    home:t("الرئيسية","Accueil"),
    books:t("فضاء الكتب","Espace des livres"),
    collections:t("السلاسل وكتب الجيب","Collections et livres de poche"),
    periodicals:t("المجلات والدوريات","Revues et périodiques"),
    articles:t("المقالات والدراسات","Articles et études"),
    authors:t("المؤلفون والناشرون","Auteurs et éditeurs"),
    classification:t("التصنيف الموضوعي","Classification"),
    backup:t("النسخ والمزامنة","Sauvegarde et sync")
  };
  $("pageHeading").textContent=titles[p]||titles.home;
  render();
}

function render(){
  const v=$("view");
  if(!v)return;
  if(state.page==="home")renderHome(v);
  else if(state.page==="books")renderBooks(v);
  else if(state.page==="collections")renderCollections(v);
  else if(state.page==="periodicals")renderPeriodicals(v);
  else if(state.page==="articles")renderArticles(v);
  else if(state.page==="authors")renderAuthors(v);
  else if(state.page==="classification")renderClassification(v);
  else if(state.page==="backup")renderBackup(v);
}

function renderHome(v){
  v.innerHTML=`
    <div class="welcome">
      <div>
        <div class="eyebrow">${t("فهرسة شخصية منظمة","CATALOGUE PERSONNEL STRUCTURÉ")}</div>
        <h2>${t("أهلاً بك في مكتبتك الرقمية","Bienvenue dans votre bibliothèque")}</h2>
        <p>${t("إدارة الكتب، السلاسل، المجلات، المقالات، المؤلفين، الناشرين والتصنيف الموضوعي.","Gérez livres, collections, revues, articles, auteurs, éditeurs et classification.")}</p>
      </div>

window.runGlobalSearch=function(q){
  const box=$("globalResults");
  if(!box)return;
  const term=(q||"").trim().toLowerCase();
  if(!term){box.innerHTML="";return;}
  const matchBooks=state.books.filter(b=>JSON.stringify(b).toLowerCase().includes(term));
  const matchArts=state.articles.filter(a=>JSON.stringify(a).toLowerCase().includes(term));
  const matchAuth=state.authors.filter(a=>JSON.stringify(a).toLowerCase().includes(term));
  const matchPubs=state.publishers.filter(p=>JSON.stringify(p).toLowerCase().includes(term));
  let html="";
  if(matchBooks.length){
    html+=`<h4>${t("الكتب","Livres")} (${matchBooks.length})</h4>`+matchBooks.map(b=>`<button class="result-row" type="button" onclick="window.showBookDetail('${b.id}')"><strong>${esc(b.title)}</strong><span>${esc((b.authors||[]).join("، "))}</span></button>`).join("");
  }
  if(matchArts.length){
    html+=`<h4>${t("المقالات","Articles")} (${matchArts.length})</h4>`+matchArts.map(a=>`<button class="result-row" type="button" onclick="window.showArticleDetail('${a.id}')"><strong>${esc(a.title)}</strong><span>${esc(a.author||"")}</span></button>`).join("");
  }
  if(matchAuth.length){
    html+=`<h4>${t("المؤلفون","Auteurs")} (${matchAuth.length})</h4>`+matchAuth.map(a=>`<div class="result-row"><strong>${esc(a.name)}</strong><span>${esc(a.country||"")}</span></div>`).join("");
  }
  if(matchPubs.length){
    html+=`<h4>${t("الناشرون","Éditeurs")} (${matchPubs.length})</h4>`+matchPubs.map(p=>`<div class="result-row"><strong>${esc(p.name)}</strong><span>${esc(p.place||"")}</span></div>`).join("");
  }
  box.innerHTML=html||`<div class="empty">${t("لا توجد نتائج مطابقة.","Aucun résultat.")}</div>`;
};

window.filterBooksTable=function(){
  const wrap=$("booksTableWrap");
  if(!wrap)return;
  const q=($("bookSearch")?$("bookSearch").value:"").trim().toLowerCase();
  const dom=$("filterDomain")?$("filterDomain").value:"";
  const st=$("filterStatus")?$("filterStatus").value:"";
  const lng=$("filterLang")?$("filterLang").value:"";
  const rows=state.books.filter(b=>{
    if(dom && b.domain!==dom)return false;
    if(st && (b.readingStatus||"unread")!==st)return false;
    if(lng && b.language!==lng)return false;
    if(q && !JSON.stringify(b).toLowerCase().includes(q))return false;
    return true;
  });
  if(!rows.length){
    wrap.innerHTML=`<div class="empty"><div class="big">▤</div>${t("لا توجد كتب مسجلة بعد.","Aucun livre enregistré.")}</div>`;

function renderBookAuthorPicker(){
  const dl=$("authorSuggestions"),box=$("authorChoices");

  if(!box)return;
  if(!state.authors.length){
    box.innerHTML=`<small class="muted">${t("لا يوجد مؤلفون مسجلون بعد.","Aucun auteur enregistré.")}</small>`;
    return;
  }
  box.innerHTML=state.authors.map(a=>{
    const checked=selectedBookAuthors.includes(a.name)?"checked":"";
    return `<label style="display:flex;align-items:center;gap:6px;font-size:12px"><input type="checkbox" ${checked} onchange="window.toggleBookAuthor('${esc(a.name)}',this.checked)"> ${esc(a.name)}</label>`;
  }).join("");
}
window.toggleBookAuthor=function(name,checked){
  if(checked && !selectedBookAuthors.includes(name))selectedBookAuthors.push(name);
  if(!checked)selectedBookAuthors=selectedBookAuthors.filter(x=>x!==name);
};
window.addAuthorToBook=function(){

$("bookForm").addEventListener("submit",e=>{
  e.preventDefault();
  const title=$("title").value.trim();
  if(!title)return;
  const typedAuthor=($("authorSearch").value||"").trim();
  if(typedAuthor && !selectedBookAuthors.includes(typedAuthor))selectedBookAuthors.push(typedAuthor);
  for(const n of selectedBookAuthors){
    if(!state.authors.some(a=>a.name===n))state.authors.push({id:"au_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),name:n,bio:"",country:""});
  }
  const pub=$("publisher").value.trim();
  if(pub && !state.publishers.some(p=>p.name===pub))state.publishers.push({id:"pub_"+Date.now(),name:pub,place:$("place")?$("place").value.trim():"",notes:""});
  const rec={
    id:$("editId").value||("b_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)),
    title,
    authors:selectedBookAuthors,
    language:$("language").value,
    kind:$("kind").value,
    readingStatus:$("readingStatus").value,
    domain:$("domain").value,
    subdomain:$("subdomain").value.trim(),
    topic:$("topic").value.trim(),
    publisher:pub,
    place:$("place").value.trim(),
    year:$("year").value.trim(),
    edition:$("edition").value.trim(),
    pages:$("pages").value.trim(),
    isbn:$("isbn").value.trim(),
    shelf:$("shelf").value.trim(),
    series:$("series").value,
    seriesNo:$("seriesNo").value.trim(),
    keywords:$("keywords").value.split(/[،,]/).map(s=>s.trim()).filter(Boolean),
    notes:$("notes").value.trim()
  };
  const idx=state.books.findIndex(x=>x.id===rec.id);
  if(idx>=0)state.books[idx]=rec;
  else state.books.push(rec);
  save();
  closeBookModal();
  toast(t("تم حفظ الكتاب.","Livre enregistré."));
  render();
});

        <label class="outline" style="cursor:pointer">⬆ ${t("استيراد نسخة احتياطية","Importer")}<input type="file" accept=".json" style="display:none" onchange="window.importLibrary(event)"></label>
        <button class="outline" type="button" onclick="window.openAuthModal()">☁ ${t("إعدادات الحساب والمزامنة","Compte et sync")}</button>
      </div>
      <p class="hint" style="margin-top:12px">${t("آخر تحديث محلي: ","Dernière mise à jour locale : ")}<b>${esc(state.updatedAt||"—")}</b></p>
    </div>
  `;

window.exportLibrary=function(){
  const blob=new Blob([JSON.stringify(buildPayload(),null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`maktabati_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
};
window.importLibrary=function(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      applyRemotePayload(data);
      save();
      toast(t("تم استيراد البيانات بنجاح.","Données importées."));
    }catch{
      toast(t("ملف غير صالح.","Fichier invalide."));
    }
  };
  r.readAsText(f);
};

document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("langBtn").addEventListener("click",()=>{state.lang=ar()?"fr":"ar";localStorage.setItem("mb_lang",state.lang);applyLang();});
$("themeBtn").addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";localStorage.setItem("mb_theme",state.theme);applyTheme();});
$("quickAdd").addEventListener("click",()=>window.openBookModal());
$("closeModal").addEventListener("click",closeBookModal);
$("cancelForm").addEventListener("click",closeBookModal);

applyTheme();
applyLang();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3r6dSEv--pL4gZhsHkyz1TgiP1NMuprc",
  authDomain: "ma-bibliotheque-cloud.firebaseapp.com",
  projectId: "ma-bibliotheque-cloud",
  storageBucket: "ma-bibliotheque-cloud.firebasestorage.app",
  messagingSenderId: "39969016798",
  appId: "1:39969016798:web:39056014bbcd0dbe90ab4f"
};

let pushTimer = null;

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  async function pushNow(showFeedback = false) {
    if (!auth.currentUser) return;
    setSyncStatus("syncing");
    const ref = doc(db, "libraries", auth.currentUser.uid);
    await setDoc(ref, buildPayload(), { merge: true });
    setSyncStatus("online");
    if (showFeedback) toast(t("تمت المزامنة مع السحابة.","Synchronisé avec le cloud."));
  }

  async function pullNow(showFeedback = false) {
    if (!auth.currentUser) return;
    setSyncStatus("syncing");
    const ref = doc(db, "libraries", auth.currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data();
      if (!state.updatedAt || (remote.updatedAt && remote.updatedAt > state.updatedAt)) {
        applyRemotePayload(remote);
        writeLocalStorageOnly();
      }
    }
    setSyncStatus("online");
    if (showFeedback) toast(t("تم جلب البيانات السحابية.","Données cloud récupérées."));
  }

  window.__mbSchedulePush = function () {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      pushNow(false).catch(() => setSyncStatus("error"));
    }, 600);
  };

  window.__mbCloudImpl = {
    signInEmail: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
    signUpEmail: (email, pass) => createUserWithEmailAndPassword(auth, email, pass),
    signInGoogle: () => signInWithPopup(auth, provider),
    signOut: () => signOut(auth),
    pushNow,
    pullNow
  };

  onAuthStateChanged(auth, async (user) => {
    state.user = user || null;
    window.__mbCloud.user = user || null;
    updateAuthHeaderUI();
    if (user) {
      try {
        await pullNow(false);
      } catch {
        setSyncStatus("error");
      }
    } else {
      setSyncStatus("local");
    }
  });

  window.__mbCloud.ready = true;
} catch (err) {
  window.__mbCloud.ready = false;
  setSyncStatus("error");
}
</script>
